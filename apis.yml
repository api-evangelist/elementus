x-coverage:
  state: none
  reason: defunct
  detail: >-
    Elementus' entire web surface has been withdrawn from DNS — the apex publishes
    no address record, www.elementus.io is NXDOMAIN, and both
    attribution-api.elementus.io and app.elementus.io are dangling CNAMEs to an AWS
    load balancer and a CloudFront distribution that no longer exist — while the
    zone itself stays live on Cloudflare and still routes mail to Google Workspace,
    so the company has parked its public presence rather than released the domain.
