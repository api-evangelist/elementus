aid: elementus
name: Elementus
description: 'Elementus is a New York blockchain intelligence company founded in 2017
  that attributes on-chain addresses to real-world entities across multiple chains,
  and sells that attribution graph to compliance, investigations and market-intelligence
  teams. Its public API surface is the Attribution API, a key-authenticated REST service
  at attribution-api.elementus.io that resolves batches of blockchain addresses to
  a beneficial owner, custodian, entity name and OFAC/SDN sanction status. As of the
  2026-08-12 probe every Elementus web host — the marketing site, the app and the API
  — is unresolvable in DNS, so the developer surface documented here is reconstructed
  from the company''s own public GitHub organization rather than from a live site.'
